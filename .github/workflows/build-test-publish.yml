name: Build, Test, Publish

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build + Unit Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Serpy.slnx

      - name: Build
        run: dotnet build Serpy.slnx --no-restore -c Release

      - name: Unit tests (Core + App headless)
        run: |
          dotnet test Serpy.slnx --no-build -c Release `
            --filter "FullyQualifiedName!~IntegrationTests" `
            --logger "console;verbosity=normal"

  publish-windows:
    name: Windows x64 Native-AOT publish
    runs-on: windows-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Serpy.App (Windows x64, Native-AOT)
        run: |
          dotnet publish src/Serpy.App/Serpy.App.csproj `
            -c Release -r win-x64 `
            /p:PublishAot=true `
            -o publish/win-x64

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: serpy-app-win-x64
          path: publish/win-x64/
          retention-days: 30
