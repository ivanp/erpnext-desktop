name: Build, Test, Publish

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build + Unit Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Serpy.slnx

      - name: Build
        run: dotnet build Serpy.slnx --no-restore -c Release

      - name: Unit tests (Core + App headless)
        run: |
          dotnet test Serpy.slnx --no-build -c Release `
            --filter "FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~UiTests" `
            --logger "console;verbosity=normal"

  publish-windows:
    name: Windows x64 Native-AOT publish
    runs-on: windows-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Native-AOT runtime pack
        run: dotnet restore src/Serpy.App/Serpy.App.csproj -r win-x64 /p:PublishAot=true

      - name: Publish Serpy.App (Windows x64, Native-AOT)
        run: |
          dotnet publish src/Serpy.App/Serpy.App.csproj `
            -c Release -r win-x64 --no-restore `
            /p:PublishAot=true `
            /p:SelfContained=true `
            -o publish/win-x64

      - name: Assert Native-AOT executable and provisioning assets
        run: |
          $required = @(
            'publish/win-x64/Serpy.App.exe',
            'publish/win-x64/config/versions.yaml',
            'publish/win-x64/cloud-init/user-data',
            'publish/win-x64/cloud-init/meta-data',
            'publish/win-x64/guest/init-data.sh',
            'publish/win-x64/guest/recover.sh',
            'publish/win-x64/guest/provision-done.sh'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing Native-AOT publish output: $($missing -join ', ')" }

      - name: Package portable Windows ZIP
        run: ./eng/package-windows.ps1 -PublishDirectory publish/win-x64 -OutputDirectory dist

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: serpy-app-win-x64
          path: dist/
          retention-days: 30

      - name: Publish Serpy.InstallerBootstrapper (IR3/IKTD1)
        run: |
          dotnet publish src/Serpy.InstallerBootstrapper/Serpy.InstallerBootstrapper.csproj `
            -c Release -r win-x64 --self-contained false `
            -o publish/bootstrapper-win-x64

      - name: Assert bootstrapper executable
        run: |
          if (-not (Test-Path 'publish/bootstrapper-win-x64/Serpy.InstallerBootstrapper.exe')) {
            throw 'Missing Serpy.InstallerBootstrapper.exe from publish output.'
          }

      - name: Install WiX v5 (not v7+, which requires an EULA fee unsuited to CI)
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.Util.wixext/5.0.2

      - name: Build Serpy MSI
        # No production descriptor-signing key or Authenticode certificate is
        # provisioned in this repo's CI yet (IR7/IU3's signing pipeline is a
        # documented, not-yet-delivered follow-on -- see docs/results.md).
        # -AllowMissingDescriptor produces a real, structurally complete MSI
        # whose installed bootstrapper honestly fails closed at first-run
        # setup rather than silently claiming a working install; this is not
        # the release artifact until a real signing key/cert exist.
        run: |
          ./eng/installer/build-msi.ps1 `
            -AppPublishDir publish/win-x64 `
            -BootstrapperPublishDir publish/bootstrapper-win-x64 `
            -OutputPath dist/Serpy.msi `
            -Version "0.0.0" `
            -AllowMissingDescriptor

      - name: Upload Windows MSI (unsigned dev build -- not a release artifact)
        uses: actions/upload-artifact@v4
        with:
          name: serpy-msi-unsigned-dev
          path: dist/Serpy.msi
          retention-days: 30

  publish-extension-targets:
    name: ${{ matrix.name }} target publish
    runs-on: ${{ matrix.runner }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            runner: macos-13
            rid: osx-x64
          - name: Linux x64
            runner: ubuntu-latest
            rid: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore target runtime pack
        run: dotnet restore src/Serpy.App/Serpy.App.csproj -r ${{ matrix.rid }}

      - name: Publish compile-only extension target
        run: >-
          dotnet publish src/Serpy.App/Serpy.App.csproj
          -c Release -r ${{ matrix.rid }} --no-restore
          /p:SelfContained=true
          -o publish/${{ matrix.rid }}

      - name: Assert GUI artifact and provisioning assets
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $required = @(
            "publish/${{ matrix.rid }}/Serpy.App$extension",
            'publish/${{ matrix.rid }}/config/versions.yaml',
            'publish/${{ matrix.rid }}/cloud-init/user-data',
            'publish/${{ matrix.rid }}/guest/init-data.sh'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing extension publish output: $($missing -join ', ')" }

      - name: State runtime-coverage boundary
        run: echo "${{ matrix.name }} publish is compile-only; no runtime QEMU acceptance is claimed."
