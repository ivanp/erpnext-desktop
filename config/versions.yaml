# Serpy versions manifest
# All locks are exact; all floors are inclusive minimums.
# Serpy.Core parses and validates this file at build/init time (R9).

qemu:
  # Exact QEMU version reported by qemu-system-x86_64 -version from the archive.
  # ManagedRuntimeResolver verifies the extracted binary before commit.
  version: "11.1.0"
  windows:
    # CI builds a WHPX, GnuTLS, and slirp archive from the pinned source.
    # A release process must populate this immutable URL and matching SHA-256
    # together; an empty pair intentionally prevents an untrusted download.
    archiveUrl: ""
    archiveSha256: ""
    sourceUrl: "https://download.qemu.org/qemu-11.1.0.tar.xz"
    licenseNoticeUrl: "https://www.qemu.org/"

debianCloudImage:
  # Immutable Debian official trixie genericcloud release, published 2026-08-19.
  # Debian publishes SHA-512, not SHA-256; BaseImageDownloader verifies this exact value.
  version: "20260819-2575"
  url: "https://cloud.debian.org/images/cloud/trixie/20260819-2575/debian-13-genericcloud-amd64-20260819-2575.qcow2"
  sha512: "77429b411b39b43f914dc9d14bf34aa315489a1a12b5429f72e5b483bdda23c65698d33443c85d3f3ad7c3a0828ae60845406d6b99646342554d17abae29c2a3"
  release: "trixie"
  arch: "amd64"

# Guest runtime version locks (exact) and minimum floors.
# R9 build gate rejects any installed version below floor or mismatching lock.
runtime:
  python:
    lock: "3.14.7"
    floor: "3.14.0"
  node:
    lock: "24.2.0"
    floor: "24.0.0"
  mariadb:
    lock: "11.8.3"
    floor: "11.8.0"
  redis:
    lock: "8.0.2"
    floor: "8.0.0"

# Frappe/ERPNext application version locks (exact, as reported by bench version).
# lock: numeric version bench reports (normalised from v-prefixed provision tag).
# minVersion: floor used by the downgrade guard during recover.
apps:
  frappe:
    branch: "v16.31.0"
    lock: "16.31.0"
    minVersion: "16.0.0"
  erpnext:
    branch: "v16.32.3"
    lock: "16.32.3"
    minVersion: "16.0.0"
