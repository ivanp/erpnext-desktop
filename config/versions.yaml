# Serpy versions manifest
# All locks are exact; all floors are inclusive minimums.
# Serpy.Core parses and validates this file at build/init time (R9).

qemu:
  # Exact QEMU version reported by qemu-system-x86_64 -version from this installer.
  # ManagedRuntimeResolver verifies the installed binary matches this string before commit.
  version: "11.1.0"
  windows:
    # Stefan Weil pre-built Windows QEMU 11.1.0 (2026-08-11)
    # Includes GnuTLS, WHPX, slirp — confirmed on weilnetz.de build history.
    # Format: NSIS silent-install .exe (/S /D=<targetDir>, last arg, unquoted).
    # ManagedRuntimeResolver: download → SHA-256 verify → elevated NSIS install →
    #   -version probe (must match qemu.version above) → TLS object probe → atomic rename.
    installerUrl: "https://qemu.weilnetz.de/w64/qemu-w64-setup-20260811.exe"
    sha256: "f98a8aeb5f7faea9765b6dee28316c266cd179d80354a2fed8e50176f9a2e59f"
    sourceUrl: "https://download.qemu.org/qemu-11.1.0.tar.xz"
    licenseNoticeUrl: "https://qemu.weilnetz.de/w64/qemu-w64-setup-20260811.exe"
    # archiveUrl/archiveSha256: CI-built zip (build-windows.ps1). Empty = use installer above.
    archiveUrl: ""
    archiveSha256: ""

debianCloudImage:
  version: "20250801-2143"
  url: "https://cloud.debian.org/images/cloud/trixie/daily/20250801-2143/debian-13-genericcloud-amd64-daily-20250801-2143.qcow2"
  sha256: ""                 # fill from download page checksum file
  release: "trixie"
  arch: "amd64"

# Guest runtime version locks (exact) and minimum floors.
# R9 build gate rejects any installed version below floor or mismatching lock.
runtime:
  python:
    lock: "3.14.1"
    floor: "3.14.0"
  node:
    lock: "24.2.0"
    floor: "24.0.0"
  mariadb:
    lock: "11.8.3"
    floor: "11.8.0"
  redis:
    lock: "8.0.1"
    floor: "8.0.0"

# Frappe/ERPNext application version locks.
apps:
  frappe:
    branch: "version-16"
    minVersion: "16.0.0"
  erpnext:
    branch: "version-16"
    minVersion: "16.0.0"
